[package]
name = "modelgate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Ofek Gabay"]
description = "Block code edits from AI agents unless the editing model is allowed for that file type"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tupe12334/modelgate"
homepage = "https://github.com/tupe12334/modelgate"
documentation = "https://docs.rs/modelgate"
readme = "README.md"
keywords = ["claude-code", "ai-agent", "hook", "llm", "guardrail"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[bin]]
name = "modelgate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
etcetera = "0.11.0"
globset = "0.4.21"
polyhook = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
